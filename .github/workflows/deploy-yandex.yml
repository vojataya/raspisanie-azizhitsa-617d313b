# Выкладка сайта в Yandex Object Storage (бакет раздаётся API-шлюзом Яндекса).
# Секретов в репозитории нет: GitHub выдаёт OIDC-токен, Яндекс меняет его на IAM-токен
# сервисного аккаунта raspisanie-deployer через федерацию raspisanie-github
# (https://yandex.cloud/ru/docs/tutorials/security/wlif-github-integration).
# Федерация пускает только запуски из ветки main этого репозитория
# (subject repo:vojataya/raspisanie-azizhitsa-617d313b:ref:refs/heads/main).
# У аккаунта одна роль — storage.uploader на бакет: может загружать и перезаписывать, удалять не может.
name: Выкладка в Yandex Cloud

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-yandex
  cancel-in-progress: true

env:
  BUCKET: raspisanie-school-widget
  YC_SA_ID: ajeeufo2ag1c993m4di1 # raspisanie-deployer
  OIDC_AUDIENCE: https://github.com/vojataya # audience федерации raspisanie-github
  SITE_URL: https://d5der4rtb2l8bb2sglbe.764nr5vy.apigw.yandexcloud.net

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Код
        uses: actions/checkout@v7

      - name: Node.js LTS
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      # package-lock.json не в синхроне с package.json (npm ci падает), поэтому npm install.
      - name: Зависимости
        run: npm install --no-audit --no-fund

      - name: Сборка
        run: npm run build

      - name: IAM-токен Яндекса через федерацию
        id: iam
        run: |
          set -euo pipefail
          AUD=$(jq -rn --arg a "$OIDC_AUDIENCE" '$a|@uri')
          ID_TOKEN=""
          for i in 1 2 3; do
            ID_TOKEN=$(curl -sS --fail --max-time 30 \
              -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUD" | jq -r '.value // empty') && [ -n "$ID_TOKEN" ] && break
            sleep 3
          done
          [ -n "$ID_TOKEN" ] || { echo "::error::Не удалось получить OIDC-токен GitHub"; exit 1; }
          echo "::add-mask::$ID_TOKEN"
          # Несекретные поля токена — чтобы при отказе было видно, что именно сверяет федерация.
          printf '%s' "$ID_TOKEN" | python3 -c 'import sys,json,base64; p=sys.stdin.read().split(".")[1]; p+="="*(-len(p)%4); d=json.loads(base64.urlsafe_b64decode(p)); print("OIDC:", json.dumps({k: d.get(k) for k in ("sub","aud","ref","event_name")}, ensure_ascii=False))'

          IAM=""
          for i in 1 2 3 4 5; do
            RESP=$(curl -sS --max-time 30 -X POST https://auth.yandex.cloud/oauth/token \
              -H "Content-Type: application/x-www-form-urlencoded" \
              --data-urlencode "grant_type=urn:ietf:params:oauth:grant-type:token-exchange" \
              --data-urlencode "requested_token_type=urn:ietf:params:oauth:token-type:access_token" \
              --data-urlencode "audience=$YC_SA_ID" \
              --data-urlencode "subject_token=$ID_TOKEN" \
              --data-urlencode "subject_token_type=urn:ietf:params:oauth:token-type:id_token") || RESP=""
            IAM=$(jq -r '.access_token // empty' <<<"$RESP" 2>/dev/null || true)
            [ -n "$IAM" ] && break
            echo "Обмен токена, попытка $i: $(jq -c 'del(.access_token)' <<<"$RESP" 2>/dev/null || echo 'нет ответа')"
            sleep 5
          done
          [ -n "$IAM" ] || { echo "::error::Яндекс не выдал IAM-токен (проверь федерацию raspisanie-github и привязку raspisanie-deployer)"; exit 1; }
          echo "::add-mask::$IAM"
          echo "token=$IAM" >> "$GITHUB_OUTPUT"

      # Правила: assets/* — на год (имена уникальные), *.html — no-cache, прочее — час.
      # Сначала всё, кроме HTML, потом HTML: index.html никогда не ссылается на ещё не залитые файлы.
      # Старые файлы из бакета не удаляются — открытые вкладки со старыми assets продолжают работать.
      - name: Заливка dist в бакет
        env:
          YC_IAM_TOKEN: ${{ steps.iam.outputs.token }}
        run: |
          set -euo pipefail
          cd dist
          content_type() {
            case "$1" in
              *.html) echo "text/html; charset=utf-8" ;;
              *.js|*.mjs) echo "application/javascript; charset=utf-8" ;;
              *.css) echo "text/css; charset=utf-8" ;;
              *.json|*.map) echo "application/json; charset=utf-8" ;;
              *.webmanifest) echo "application/manifest+json; charset=utf-8" ;;
              *.txt) echo "text/plain; charset=utf-8" ;;
              *.xml) echo "application/xml; charset=utf-8" ;;
              *.svg) echo "image/svg+xml" ;;
              *.ico) echo "image/x-icon" ;;
              *.png) echo "image/png" ;;
              *.jpg|*.jpeg) echo "image/jpeg" ;;
              *.gif) echo "image/gif" ;;
              *.webp) echo "image/webp" ;;
              *.avif) echo "image/avif" ;;
              *.woff2) echo "font/woff2" ;;
              *.woff) echo "font/woff" ;;
              *.ttf) echo "font/ttf" ;;
              *.otf) echo "font/otf" ;;
              *.mp4) echo "video/mp4" ;;
              *.webm) echo "video/webm" ;;
              *.pdf) echo "application/pdf" ;;
              *) echo "application/octet-stream" ;;
            esac
          }
          cache_control() {
            case "$1" in
              assets/*) echo "public, max-age=31536000, immutable" ;;
              *.html) echo "no-cache" ;;
              *) echo "public, max-age=3600" ;;
            esac
          }
          put() {
            local key="$1" ct cc code=000
            ct=$(content_type "$key"); cc=$(cache_control "$key")
            for i in 1 2 3 4 5; do
              code=$(curl -sS -o /tmp/put.out -w '%{http_code}' --connect-timeout 10 --max-time 120 -X PUT \
                -H "X-YaCloud-SubjectToken: $YC_IAM_TOKEN" \
                -H "Content-Type: $ct" -H "Cache-Control: $cc" \
                --data-binary @"$key" "https://storage.yandexcloud.net/$BUCKET/$key") || code=000
              [ "$code" = 200 ] && break
              sleep 3
            done
            printf '%s\t%s\t%s\t%s\n' "$code" "$key" "$ct" "$cc"
            if [ "$code" != 200 ]; then head -c 500 /tmp/put.out || true; echo; echo "::error::Не залился $key (HTTP $code)"; exit 1; fi
          }
          find . -type f ! -name vercel.json ! -name _redirects | sed 's|^\./||' | sort > /tmp/files.txt
          grep -v '\.html$' /tmp/files.txt > /tmp/first.txt || true
          grep '\.html$' /tmp/files.txt > /tmp/last.txt || true
          while read -r key; do put "$key"; done < /tmp/first.txt
          while read -r key; do put "$key"; done < /tmp/last.txt
          echo "Залито файлов: $(wc -l < /tmp/files.txt)"

      - name: Проверка сайта
        run: |
          set -euo pipefail
          MAIN_JS=$(grep -o '/assets/index-[A-Za-z0-9_-]*\.js' dist/index.html | head -1)
          [ -n "$MAIN_JS" ] || { echo "::error::В dist/index.html не найден главный js"; exit 1; }
          echo "Ожидаемый главный js: $MAIN_JS"
          for i in 1 2 3 4 5; do
            PAGE=$(curl -sS --connect-timeout 10 --max-time 30 -H 'Cache-Control: no-cache' "$SITE_URL/" || true)
            if grep -qF "$MAIN_JS" <<<"$PAGE"; then
              CODE=$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 10 --max-time 30 -I "$SITE_URL$MAIN_JS" || echo 000)
              if [ "$CODE" = 200 ]; then echo "Сайт отдаёт новую сборку: $MAIN_JS (HEAD $CODE)"; exit 0; fi
              echo "Попытка $i: index.html новый, но $MAIN_JS отдаёт HTTP $CODE"
            else
              echo "Попытка $i: на сайте пока другой index.html ($(grep -o '/assets/index-[A-Za-z0-9_-]*\.js' <<<"$PAGE" | head -1 || echo 'js не найден'))"
            fi
            sleep 10
          done
          echo "::error::После 5 попыток сайт не отдаёт новую сборку"
          exit 1
